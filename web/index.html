<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shrooms-board</title>
<style>
:root{--bg:#172b4d;--col:#121c35;--card:#1d2b4a;--card-h:#24365c;--txt:#e3e8f4;--dim:#8fa3c8;--acc:#57a3ff;--danger:#ff7a7a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,sans-serif;min-height:100vh}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:rgba(0,0,0,.25)}
header h1{font-size:16px;font-weight:600}
header .me{margin-left:auto;color:var(--dim)}
header input{background:var(--col);border:1px solid #2c3f66;color:var(--txt);border-radius:6px;padding:4px 8px;width:140px}
#warn{display:none;margin:0 16px;padding:6px 12px;background:#4a1f1f;color:#ffb0b0;border-radius:6px;font-size:12px}
#board{display:flex;gap:12px;padding:12px 16px;align-items:flex-start;overflow-x:auto}
.col{background:var(--col);border-radius:10px;min-width:270px;width:270px;flex-shrink:0;padding:10px}
.col h2{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between}
.col h2 .del{cursor:pointer;opacity:.5}.col h2 .del:hover{opacity:1}
.cards{min-height:8px}
.card{background:var(--card);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:grab;border:1px solid transparent}
.card:hover{background:var(--card-h)}
.card.dragging{opacity:.4}
.card .t{font-weight:500;word-break:break-word}
.card .d{color:var(--dim);font-size:12px;margin-top:4px;white-space:pre-wrap}
.card .meta{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:10px;background:#2c3f66;color:var(--acc);border-radius:4px;padding:1px 6px}
.badge.due{color:#ffc46b}
/* The bridge's projection (docs/task-bridge.md). The colour says whose move it is:
   running is neutral, terminal-but-UNACKED is amber because a human still owes a look,
   and a failure is red. `as of` lives in the tooltip, never invented here. */
/* The fleet strip: the mesh's sessions and their live state. */
#fleet{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
#fleet .fl{font-size:10px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
#fleet .fa{font-size:11px;border:1px solid #2c3f66;border-radius:4px;padding:1px 6px;color:#9fb4d8}
#fleet .fa i{font-style:normal;color:var(--dim);margin-left:5px;font-size:10px}
#fleet .fa.on{border-color:#5fd39a;color:#5fd39a}
#fleet .fa.on i{color:#5fd39a}
#fleet .fa.wait{border-color:#ffc46b;color:#ffc46b}
#fleet .fa.wait i{color:#ffc46b}
.badge.task{color:#9fb4d8}
.badge.task.working,.badge.task.submitted,.badge.task.queued{color:var(--acc)}
.badge.task.completed{color:#5fd39a}
.badge.task.unacked{color:#ffc46b;border:1px solid #ffc46b}
.badge.task.failed,.badge.task.canceled,.badge.task.rejected,.badge.task.expired{color:#ff8a8a}
.badge.task.stalled{color:#ffc46b}
button,select{background:#2c3f66;color:var(--txt);border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
button:hover{filter:brightness(1.15)}
.addlist{width:270px;flex-shrink:0;background:rgba(255,255,255,.06);border-radius:10px;padding:10px;text-align:center;color:var(--dim);cursor:pointer}
.addcard{color:var(--dim);font-size:13px;padding:6px 4px;cursor:pointer;border-radius:6px}
.addcard:hover{background:rgba(255,255,255,.05)}
/* margin:auto is REQUIRED: the `*{margin:0}` reset above overrides the browser's own
   `dialog { margin: auto }`, which is what centres a modal. Without this it sits in the
   top-left corner. */
dialog{background:var(--col);color:var(--txt);border:1px solid #2c3f66;border-radius:10px;padding:16px;min-width:340px;max-width:480px;margin:auto;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin-bottom:10px;font-size:15px}
dialog textarea,input[type=text]{width:100%;background:var(--card);border:1px solid #2c3f66;color:var(--txt);border-radius:6px;padding:6px 8px;font:inherit}
dialog .row{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
dialog .lbl{font-size:12px;color:var(--dim);margin:8px 0 4px}
#empty{color:var(--dim);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <h1 id="title">shrooms-board</h1>
  <select id="board-pick" title="which board"></select>
  <span class="me">you are <input id="me" placeholder="your name"></span>
</header>
<div id="warn"></div>
<div id="fleet"></div>
<div id="board"></div>
<dialog id="dlg">
  <h3 id="dlg-title">Card</h3>
  <div class="lbl">Title</div><input type="text" id="f-title">
  <div class="lbl">Description</div><textarea id="f-desc" rows="3"></textarea>
  <div class="lbl">Due (ms epoch, empty = none)</div><input type="text" id="f-due">
  <div class="lbl">Assignees</div><div id="f-assign" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <div class="lbl">Task</div><div id="f-task" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"></div>
  <div class="lbl">Dispatch to</div>
  <div class="row"><select id="f-agent" style="flex:1"></select><button id="f-dispatch">Dispatch</button></div>
  <div class="row"><button id="f-del" style="background:#5a2430;color:#ff9d9d">Delete</button><button id="f-close">Close</button><button id="f-save">Save</button></div>
</dialog>
<div id="empty">Loading…</div>
<script type="module">
const $ = (s) => document.querySelector(s);
const me = $('#me');
me.value = localStorage.getItem('me') || '';
me.onchange = () => localStorage.setItem('me', me.value.trim());

let state = null;
let editing = null;

// The task state the bridge reflected onto this card. It is a CACHE with a provenance: the
// tooltip carries the task store's own timestamp, so a reader can judge age without
// anything clock-derived ever entering the log. Done is not done until it is acked, so a
// terminal state with a pending ack is called out rather than shown as finished.
const TERMINAL = ['completed', 'failed', 'canceled', 'rejected', 'expired'];
function taskBadge(card) {
  const t = card.task;
  if (!t || !t.state) return '';
  const unacked = TERMINAL.indexOf(t.state) >= 0 && t.ack !== 'acked';
  const cls = ['task', t.state, unacked ? 'unacked' : '', t.stalled ? 'stalled' : ''].filter(Boolean).join(' ');
  const label = t.state + (t.ack === 'acked' ? ' \u00b7 acked' : (unacked ? ' \u00b7 unacked' : ''));
  const title = `as of ${t.at}${t.stalled ? ' (stalled)' : ''}${card.task_ref ? '\n' + card.task_ref : ''}`;
  return `<span class="badge ${cls}" title="${esc(title)}">${esc(label)}</span>`;
}

// The card's task: what the bridge last heard, with its provenance. Nothing is invented
// here - with no task the row says so, and with one the tooltip carries the store's own
// timestamp.
function renderTaskRow(card) {
  const ft = $('#f-task');
  ft.innerHTML = '';
  if (!card.task) {
    const s = document.createElement('span');
    s.className = 'badge';
    s.textContent = card.task_ref ? 'no state yet' : 'no task';
    ft.appendChild(s);
  } else {
    ft.innerHTML = taskBadge(card);
  }
  if (card.task) {
    // The store gives us a state, an ack and its own timestamp - so show all three rather
    // than hiding the timestamp in a tooltip. It does NOT give the request text, which is
    // why a task card has no description: there is nothing to invent.
    const bits = [];
    if (card.task.at) bits.push('as of ' + card.task.at);
    if (card.task.stalled) bits.push('stalled');
    if (bits.length) {
      const s = document.createElement('span');
      s.style.cssText = 'font-size:11px;color:var(--dim)';
      s.textContent = bits.join(' \u00b7 ');
      ft.appendChild(s);
    }
  }
  if (card.task_ref) {
    const r = document.createElement('span');
    r.style.cssText = 'font-size:11px;color:var(--dim);word-break:break-all';
    r.textContent = card.task_ref;
    r.title = 'task reference';
    ft.appendChild(r);
  }
  loadAgents();
}

let agentsLoaded = false;
async function loadAgents() {
  if (agentsLoaded) return;
  agentsLoaded = true;
  const sel = $('#f-agent');
  sel.innerHTML = '<option value="">loading…</option>';
  try {
    const d = await (await fetch('/agents')).json();
    sel.innerHTML = '';
    for (const a of d.agents || []) {
      const o = document.createElement('option');
      o.value = a.machine + '|' + a.session;
      o.textContent = `${a.machine}/${a.session} \u00b7 ${a.state}${a.harness ? ' (' + a.harness + ')' : ''}`;
      sel.appendChild(o);
    }
    if (!sel.options.length) sel.innerHTML = '<option value="">no agents answered</option>';
  } catch {
    sel.innerHTML = '<option value="">could not list agents</option>';
  }
}

// Point an agent at this card. requestId is fresh per click and is what makes a RETRY the
// same task instead of a second agent turn (the hub derives the messageId from it).
function wireDispatch(card) {
  $('#f-dispatch').onclick = async () => {
    const v = ($('#f-agent').value || '').split('|');
    if (v.length !== 2 || !v[0] || !v[1]) return;
    const requestId = (crypto.randomUUID ? crypto.randomUUID() : 'req-' + Date.now());
    $('#f-dispatch').disabled = true;
    try {
      const r = await fetch(`/boards/${card.board_id}/cards/${card.id}/dispatch`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ machine: v[0], session: v[1], requestId }),
      });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) alert(out.error || 'dispatch failed');
      else if (out.sent === false) alert('the link is on the card, but the agent did not answer - a retry is the same task');
    } finally {
      $('#f-dispatch').disabled = false;
    }
    $('#dlg').close();
    await refresh();
  };
}

// Which board we are looking at. Kept in localStorage so a reload lands where you were.
function curBoard() { return $('#board-pick').value || 'default'; }
function renderBoardPicker() {
  const sel = $('#board-pick');
  const want = sel.value || localStorage.getItem('board') || 'default';
  const boards = (state.boards || []).map((b) => ({ id: b.id, title: b.title || b.id }));
  sel.innerHTML = '';
  for (const b of boards) {
    const o = document.createElement('option');
    o.value = b.id; o.textContent = b.title;
    sel.appendChild(o);
  }
  sel.value = boards.some((b) => b.id === want) ? want : (boards[0] ? boards[0].id : 'default');
  sel.onchange = () => { localStorage.setItem('board', sel.value); render(); };
}

// The fleet: which sessions are on the mesh and what each is doing RIGHT NOW. The Tasks
// board shows tasks, but a task can start and finish between two polls, so the session
// states are the reliable "what is running" view. Best effort: a machine that is down is
// simply missing, never an error.
function renderFleet(agents) {
  const el = $('#fleet');
  if (!agents || !agents.length) { el.textContent = ''; return; }
  const order = { working: 0, queued: 1, idle: 2 };
  agents = agents.slice().sort((a, b) =>
    (order[a.state] ?? 9) - (order[b.state] ?? 9)
    || (a.machine + a.session).localeCompare(b.machine + b.session));
  el.innerHTML = '<span class="fl">fleet</span>' + agents.map((a) => {
    const cls = a.state === 'working' ? 'on' : (a.state === 'idle' ? 'off' : 'wait');
    return `<span class="fa ${cls}" title="${esc(a.machine + '/' + a.session)}">${esc(a.session)}<i>${esc(a.state)}</i></span>`;
  }).join('');
}

async function refresh() {
  fetch('/agents').then((r) => r.json()).then((d) => renderFleet(d.agents)).catch(() => {});
  const r = await fetch('/state');
  state = await r.json();
    renderBoardPicker();
  render();
}
setInterval(refresh, 5000);

function api(event) {
  return fetch('/events', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ events: [event] }) });
}

function render() {
  // One board at a time. The fold carries every board's lists and cards, so without
  // this filter the Fleet board and the Tasks board render mixed together.
  const lists = state.lists.filter((l) => (l.board_id || 'default') === curBoard());
  const cards = state.cards.filter((c) => (c.board_id || 'default') === curBoard());
  $('#empty').style.display = cards.length || lists.length ? 'none' : 'block';
  $('#empty').textContent = state.head === 0 ? 'Empty board — add a list to start' : 'Loading…';
  const inv = state.invariants;
  $('#warn').style.display = inv && !inv.ok ? 'block' : 'none';
  if (inv && !inv.ok) $('#warn').textContent = '⚠ surfaced invariant problems (state shown as-is): ' + inv.problems.map(p => p.what).join('; ');
  const b = $('#board');
  b.innerHTML = '';
  for (const list of lists) {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `<h2><span contenteditable class="lt">${esc(list.title ?? '')}</span><span class="del" title="delete list">✕</span></h2><div class="cards"></div><div class="addcard">+ add card</div>`;
    col.querySelector('.lt').onblur = (e) => { const t = e.target.textContent.trim(); if (t && t !== list.title) send(ev.listEdit(list.id, { title: t })); };
    col.querySelector('.del').onclick = () => { if (confirm('Delete list "' + list.title + '"? Cards in it stay (surfaced as orphaned).')) send(ev.listDelete(list.id)); };
    const cardsEl = col.querySelector('.cards');
    const listCards = cards.filter((c) => c.list_id === list.id);
    for (const card of listCards) {
      const el = document.createElement('div');
      el.className = 'card'; el.draggable = true; el.dataset.id = card.id;
      const due = card.due ? `<span class="badge due">due ${new Date(card.due).toLocaleDateString()}</span>` : '';
      const asg = card.assignees.map((a) => `<span class="badge">${esc(a)}</span>`).join('');
      el.innerHTML = `<div class="t">${esc(card.title ?? '')}</div>${card.desc ? `<div class="d">${esc(card.desc)}</div>` : ''}<div class="meta">${taskBadge(card)}${due}${asg}</div>`;
      el.onclick = () => openCard(card);
      el.ondragstart = (e) => { e.dataTransfer.setData('text/plain', card.id); el.classList.add('dragging'); };
      el.ondragend = () => el.classList.remove('dragging');
      cardsEl.appendChild(el);
    }
    cardsEl.ondragover = (e) => e.preventDefault();
    cardsEl.ondrop = (e) => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      if (!id) return;
      const after = dropIndex(cardsEl, e.clientY);
      const pos = posAt(cards, after);
      send(ev.cardEdit(id, { list_id: list.id, pos }, clockOf()));
    };
    col.querySelector('.addcard').onclick = () => {
      const t = prompt('Card title:');
      if (t && t.trim()) send(ev.cardCreate(crypto.randomUUID(), list.id, t.trim(), posAt(cards, cards.length), clockOf()));
    };
    b.appendChild(col);
  }
  const add = document.createElement('div');
  add.className = 'addlist'; add.textContent = '+ add list';
  add.onclick = () => { const t = prompt('List title:'); if (t && t.trim()) send(ev.listCreate(crypto.randomUUID(), t.trim(), (state.lists.at(-1)?.pos ?? 0) + 1000, clockOf())); };
  b.appendChild(add);
}

function dropIndex(cardsEl, y) {
  const els = [...cardsEl.querySelectorAll('.card:not(.dragging)')];
  return els.findIndex((el) => el.getBoundingClientRect().bottom > y) === -1 ? els.length
    : els.findIndex((el) => el.getBoundingClientRect().bottom > y);
}
function posAt(cards, idx) {
  const sorted = [...cards].sort((a, b) => a.pos - b.pos);
  const prev = sorted[idx - 1], next = sorted[idx];
  if (!prev) return (next ? next.pos : 1000) - 1000;
  if (!next) return prev.pos + 1000;
  return Math.round((prev.pos + next.pos) / 2) || prev.pos + 1;
}
function openCard(card) {
  editing = card;
  $('#dlg-title').textContent = 'Card';
  $('#f-title').value = card.title ?? '';
  $('#f-desc').value = card.desc ?? '';
  $('#f-due').value = card.due ?? '';
  renderTaskRow(card);
  wireDispatch(card);
  const fa = $('#f-assign'); fa.innerHTML = '';
  const meName = me.value.trim();
  if (meName) {
    const btn = document.createElement('button');
    const on = card.assignees.includes(meName);
    btn.textContent = (on ? '✓ ' : '+ ') + meName;
    btn.onclick = () => { send(ev.cardAssign(card.id, meName, !on, clockOf())).then(refresh); };
    fa.appendChild(btn);
  }
  for (const a of card.assignees.filter((x) => x !== meName)) {
    const s = document.createElement('span'); s.className = 'badge'; s.textContent = a; fa.appendChild(s);
  }
  $('#dlg').showModal();
}
$('#f-save').onclick = () => {
  if (!editing) return;
  const fields = {};
  if ($('#f-title').value !== (editing.title ?? '')) fields.title = $('#f-title').value;
  if ($('#f-desc').value !== (editing.desc ?? '')) fields.desc = $('#f-desc').value;
  const dueRaw = $('#f-due').value.trim();
  const dueN = dueRaw ? parseInt(dueRaw, 10) : null;
  if (dueN !== (editing.due ?? null) && !Number.isNaN(dueN)) fields.due = dueN;
  if (Object.keys(fields).length) send(ev.cardEdit(editing.id, fields, clockOf()));
  $('#dlg').close(); editing = null;
};
$('#f-del').onclick = () => { if (editing && confirm('Delete card?')) { send(ev.cardDelete(editing.id, clockOf())); $('#dlg').close(); editing = null; } };
$('#f-close').onclick = () => { $('#dlg').close(); editing = null; };

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

// The browser authors events with a session dev id (per-tab, stable enough for v1;
// a real per-device id comes with the Logos transport). HLC keeps ordering correct
// even if two tabs share a dev — ctr breaks ties within the same wall clock.
let dev = localStorage.getItem('dev');
if (!dev) { dev = [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem('dev', dev); }
const clock = { dev, wall: 0, ctr: 0,
  send() { const p = Date.now(); if (p > this.wall) { this.wall = p; this.ctr = 0; } else this.ctr++; return { wall: this.wall, ctr: this.ctr, dev: this.dev }; } };
function clockOf() { return clock; }

// Event constructors — the UI calls ev.<type>(...) but the helper was never
// defined, so every write path threw "ev is not defined" (review finding H2,
// caught by the real GUI walk; the API-only smoke tests never touched it).
function mkEvent(type, payload) {
  return { v: 1, id: crypto.randomUUID(), type, hlc: clock.send(), dev: clock.dev, payload };
}
const ev = {
  boardRename: (title) => mkEvent('board.rename', { title }),
  listCreate: (id, title, pos) => mkEvent('list.create', { id, title, pos }),
  listEdit: (id, fields) => mkEvent('list.edit', { id, fields }),
  listDelete: (id) => mkEvent('list.delete', { id }),
  cardCreate: (id, list_id, title, pos) => mkEvent('card.create', { id, list_id, title, pos }),
  cardEdit: (id, fields) => mkEvent('card.edit', { id, fields }),
  cardDelete: (id) => mkEvent('card.delete', { id }),
  cardAssign: (id, actor, present) => mkEvent('card.assign', { id, actor, present }),
  commentCreate: (id, card_id, text) => mkEvent('comment.create', { id, card_id, text }),
  commentDelete: (id) => mkEvent('comment.delete', { id }),
};

async function send(event) { await api(event); refresh(); }

// seed the tab clock from the server's log (max wall/ctr seen) so our first stamp sorts after it
fetch('/events?since=0').then((r) => r.json()).then(({ events }) => { for (const { event: e } of events) { clock.wall = Math.max(clock.wall, e.hlc.wall); if (e.hlc.wall === clock.wall) clock.ctr = Math.max(clock.ctr, e.hlc.ctr); } }).then(refresh);
refresh();
</script>
</body>
</html>
